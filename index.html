<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Airport Code Finder</title>
  </head>
  <body>
    <div class="wrap">
      <h1>Airport Code Finder</h1>
      <p class="sub">
        Type a 3-letter IATA or 4-letter ICAO code, or part of an airport or
        city name.
      </p>
      <p class="src" id="src"></p>
      <div class="bar">
        <input
          id="q"
          type="search"
          placeholder="BOS, KJFK, Heathrow…"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          aria-label="Search airports"
        />
        <div class="chips" id="chips"></div>
      </div>
      <div class="count" id="count"></div>
      <ul id="list"></ul>
      <p class="foot" id="foot"></p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
