<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Flights · fly</title>
  </head>
  <body>
    <div class="wrap">
      <nav class="nav">
        <a href="../" class="home" aria-label="fly home">✈️</a>
        <a href="../">Airports</a>
        <a href="../miles/">Miles</a>
        <a href="./" aria-current="page">Flights</a>
      </nav>
      <h1>Flights</h1>
      <p class="sub" id="status">Checking sign-in…</p>

      <div class="gate" id="signedOut" hidden>
        <p>Sign in to see flights.</p>
        <button class="btn primary" type="button" id="signIn">Sign in</button>
      </div>

      <div id="signedIn" hidden>
        <p class="account">
          <span>Signed in as <b id="who"></b></span>
          <button class="btn" type="button" id="signOut">Sign out</button>
        </p>
        <section class="token" id="token">
          <div class="token-head">
            <h2>API token</h2>
            <div class="token-actions">
              <button class="btn" type="button" id="copyToken" disabled>
                Copy
              </button>
              <button class="btn" type="button" id="newToken">
                Get new token
              </button>
            </div>
          </div>
          <p class="token-note" id="tokenInfo">Getting token…</p>
          <textarea
            id="tokenText"
            readonly
            rows="5"
            spellcheck="false"
            aria-label="Access token"
          ></textarea>
          <p class="token-note">
            Send it as <code>Authorization: Bearer &lt;token&gt;</code>. Anyone
            with it can read the spreadsheets you can, until it expires.
          </p>
        </section>
        <div id="flights"></div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
